name: CI - Build, Scan, Publish, Trigger CD

on:
  push:
    branches: [main]
    paths:
      - 'sample-app/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'sample-app/**'
  workflow_dispatch:

env:
  JFROG_URL: ${{ vars.JFROG_URL }}                # e.g. https://mycorp.jfrog.io
  JFROG_DOCKER_REPO: docker-sample-local           # Artifactory repo key
  IMAGE_NAME: sample-app
  WORKDIR: sample-app

permissions:
  contents: read
  id-token: write          # Required for OIDC federation to JFrog/Harness

jobs:
  # ──────────────────────────────────────────
  test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sample-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sample-app/app/requirements.txt

      - name: Install dependencies
        run: pip install -r app/requirements.txt

      - name: Run unit tests
        run: pytest -v

  # ──────────────────────────────────────────
  build-publish:
    name: Build, Scan & Publish to JFrog
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    defaults:
      run:
        working-directory: sample-app
    steps:
      - uses: actions/checkout@v4

      - name: Setup JFrog CLI (OIDC)
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL: ${{ env.JFROG_URL }}
        with:
          oidc-provider-name: github-jfrog-oidc

      - name: Compute image tag
        id: meta
        run: echo "tag=$(date +%Y%m%d)-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Docker login to Artifactory
        run: jf docker-login

      - name: Build image
        run: |
          IMAGE="${JFROG_URL#https://}/${JFROG_DOCKER_REPO}/${IMAGE_NAME}:${{ steps.meta.outputs.tag }}"
          echo "FULL_IMAGE=$IMAGE" >> $GITHUB_ENV
          docker build -t "$IMAGE" .

      - name: Push to Artifactory
        run: |
          jf docker push "$FULL_IMAGE" \
            --build-name=${{ env.IMAGE_NAME }} \
            --build-number=${{ github.run_number }}

      - name: Publish build info
        run: |
          jf rt build-collect-env  ${{ env.IMAGE_NAME }} ${{ github.run_number }}
          jf rt build-add-git      ${{ env.IMAGE_NAME }} ${{ github.run_number }}
          jf rt build-publish      ${{ env.IMAGE_NAME }} ${{ github.run_number }}

      - name: Xray security scan (fail on violations)
        run: jf build-scan ${{ env.IMAGE_NAME }} ${{ github.run_number }} --fail=true

  # ──────────────────────────────────────────
  trigger-harness:
    name: Trigger Harness Deployment
    needs: build-publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Kick off Harness pipeline
        env:
          HARNESS_API_KEY:  ${{ secrets.HARNESS_API_KEY }}
          HARNESS_ACCOUNT:  ${{ vars.HARNESS_ACCOUNT_ID }}
          HARNESS_ORG:      ${{ vars.HARNESS_ORG_ID }}
          HARNESS_PROJECT:  ${{ vars.HARNESS_PROJECT_ID }}
          HARNESS_PIPELINE: sample_app_deploy
          IMAGE_TAG:        ${{ needs.build-publish.outputs.image_tag }}
        run: |
          curl -fsSL -X POST \
            "https://app.harness.io/gateway/pipeline/api/pipeline/execute/${HARNESS_PIPELINE}?accountIdentifier=${HARNESS_ACCOUNT}&orgIdentifier=${HARNESS_ORG}&projectIdentifier=${HARNESS_PROJECT}" \
            -H "x-api-key: ${HARNESS_API_KEY}" \
            -H "Content-Type: application/yaml" \
            --data-binary @- <<EOF
          pipeline:
            identifier: ${HARNESS_PIPELINE}
            variables:
              - name: image_tag
                type: String
                value: ${IMAGE_TAG}
          EOF
